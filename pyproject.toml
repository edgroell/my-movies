[project]
name = "my-movies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ed Groell", email = "email@edgroell.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
my-movies = "my_movies:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
